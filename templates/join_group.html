{% extends "base.html" %}
{% block title %}그룹 참가하기 · 우동리{% endblock %}
{% block content %}
<div class="form-screen">
  <a href="/" class="back-link">← 돌아가기</a>
  <h1 class="form-title">그룹 참가하기</h1>

  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

  <form method="post" action="/group/join" class="form-card">
    <label class="field">
      <span class="field-label">그룹 코드</span>
      <input type="text" name="code" maxlength="6" placeholder="그룹장에게 받은 코드" required
             style="text-transform:uppercase; letter-spacing:0.15em;">
    </label>

    <label class="field">
      <span class="field-label">내 닉네임</span>
      <input type="text" name="nickname" maxlength="12" placeholder="그룹에서 쓸 이름" required>
      <span class="field-hint">한글·영어 혼용 가능, 12자 이내</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">참가하기</button>
  </form>
</div>
{% endblock %}
