{% extends "base.html" %}
{% block title %}그룹 만들기 · 우동리{% endblock %}
{% block content %}
<div class="form-screen">
  <a href="/" class="back-link">← 돌아가기</a>
  <h1 class="form-title">그룹 만들기</h1>

  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

  <form method="post" action="/group/create" class="form-card">
    <label class="field">
      <span class="field-label">그룹 이름</span>
      <input type="text" name="title" maxlength="12" placeholder="예: 영화사랑동아리" required>
      <span class="field-hint">한글·영어 혼용 가능, 12자 이내</span>
    </label>

    <label class="field">
      <span class="field-label">최대 인원</span>
      <select name="max_members" required>
        {% for n in max_options %}
        <option value="{{ n }}">{{ n }}명</option>
        {% endfor %}
      </select>
    </label>

    <label class="field">
      <span class="field-label">내 닉네임</span>
      <input type="text" name="nickname" maxlength="12" placeholder="그룹에서 쓸 이름" required>
      <span class="field-hint">한글·영어 혼용 가능, 12자 이내</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">그룹 만들고 시작하기</button>
  </form>
</div>
{% endblock %}
