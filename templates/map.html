{% extends "base.html" %}
{% block title %}지도 · {{ group.title }}{% endblock %}
{% block content %}
<div class="map-screen">
  <header class="board-header">
    <h1 class="board-title">지도</h1>
    <p class="board-sub">{{ group.title }} · 마커 {{ markers|length }}개</p>
  </header>

  <div id="group-map" class="group-map"></div>

  {% if markers|length == 0 %}
  <div class="empty-state">
    <p>아직 지도에 표시된 리뷰가 없어요.</p>
    <p>리뷰를 쓸 때 위치를 남겨보세요.</p>
  </div>
  {% endif %}
</div>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_js_key }}"></script>
<script>
  if (typeof kakao === 'undefined' || !kakao.maps) {
    console.warn('카카오맵 SDK 로드 실패: 키 또는 도메인 등록을 확인하세요.');
    document.getElementById('group-map').innerText = '지도를 불러오지 못했어요. (키/도메인 설정 확인 필요)';
  } else {
  kakao.maps.load(function () {
    const markers = {{ markers|tojson }};
    const boardUrl = "/group/{{ group.id }}/board";

    const mapContainer = document.getElementById('group-map');
    const defaultCenter = new kakao.maps.LatLng(37.5665, 126.9780);
    const center = markers.length > 0
      ? new kakao.maps.LatLng(markers[0].lat, markers[0].lng)
      : defaultCenter;

    const map = new kakao.maps.Map(mapContainer, { center: center, level: 6 });

    let openOverlay = null;

    markers.forEach(function (item) {
      const position = new kakao.maps.LatLng(item.lat, item.lng);
      const marker = new kakao.maps.Marker({ position: position, map: map });

      const stars = '★'.repeat(item.star_count) + '☆'.repeat(5 - item.star_count);
      const content = document.createElement('div');
      content.className = 'map-overlay-card';
      content.innerHTML =
        '<div class="map-overlay-top">' +
          '<span class="pill pill-' + item.category + '">' + item.category_label + '</span>' +
          '<span class="stars">' + stars + '</span>' +
        '</div>' +
        '<div class="map-overlay-title">' + item.title + '</div>' +
        '<div class="map-overlay-meta">' + item.nickname + '</div>' +
        '<a class="map-overlay-link" href="' + boardUrl + '">게시판으로 가기</a>';

      const overlay = new kakao.maps.CustomOverlay({
        position: position,
        content: content,
        yAnchor: 1.4,
      });

      kakao.maps.event.addListener(marker, 'click', function () {
        if (openOverlay) openOverlay.setMap(null);
        overlay.setMap(map);
        openOverlay = overlay;
      });
    });

    kakao.maps.event.addListener(map, 'click', function () {
      if (openOverlay) {
        openOverlay.setMap(null);
        openOverlay = null;
      }
    });
  });
  }
</script>
{% endblock %}
