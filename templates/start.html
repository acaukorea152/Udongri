{% extends "base.html" %}
{% block title %}우동리{% endblock %}
{% block content %}
<div class="hero-screen">
  <div class="hero-mark">우동리</div>
  <p class="hero-sub">우리 동아리 리뷰</p>
  <p class="hero-desc">모임도 잡고, 다녀온 곳과 본 영화의<br>기록도 함께 나눠보세요.</p>

  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

  <form method="post" action="/enter" class="hero-form">
    <input type="text" name="nickname" maxlength="12" placeholder="사용할 닉네임 (12자 이내)" required>
    <button type="submit" class="btn btn-primary btn-block">입장하기</button>
  </form>
</div>
{% endblock %}
